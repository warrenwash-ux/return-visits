<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Return Visits</title>
<meta name="description" content="Ministry return visit tracker">
<meta name="theme-color" content="#002f6c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Return Visits">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f0f4ff;
    --warm-white: #ffffff;
    --gold: #f58426;
    --gold-light: #ff9f4a;
    --deep: #002f6c;
    --brown: #001d4a;
    --muted: #5a7ab5;
    --border: #c0cfe8;
    --green: #2d6a4f;
    --green-light: #e8f5ef;
    --red: #8b2e2e;
    --red-light: #fdf0f0;
    --blue: #002f6c;
    --blue-light: #e0e9f8;
    --shadow: 0 4px 24px rgba(0,47,108,0.12);
    --shadow-lg: 0 12px 48px rgba(0,47,108,0.20);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--deep);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--deep);
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .app-icon {
    width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .app-icon img { width: 42px; height: 42px; object-fit: contain; }
  .app-title {
    font-family: 'Playfair Display', serif;
    color: var(--cream);
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .app-subtitle { color: var(--muted); font-size: 12px; margin-top: 1px; }
  .header-count {
    background: var(--gold);
    color: var(--deep);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
  }

  /* NAV TABS */
  .nav-tabs {
    background: #001d4a;
    display: flex;
    padding: 0 24px;
    gap: 0;
    overflow-x: auto;
  }
  .nav-tab {
    padding: 12px 18px;
    font-size: 13px;
    font-weight: 500;
    color: rgba(200,215,240,0.55);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .nav-tab.active { color: #f58426; border-bottom-color: #f58426; }
  .nav-tab:hover:not(.active) { color: #ffffff; }

  /* MAIN */
  main { padding: 24px; max-width: 720px; margin: 0 auto; }

  /* SECTION */
  .section { display: none; }
  .section.active { display: block; }

  /* CARDS */
  .card {
    background: var(--warm-white);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--deep);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title .icon { font-size: 18px; }

  /* SMART PARSE BOX */
  .smart-box {
    background: linear-gradient(135deg, #002f6c 0%, #001d4a 100%);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  .smart-box::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(245,132,38,0.18) 0%, transparent 70%);
    border-radius: 50%;
  }
  .smart-label {
    color: var(--gold);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .smart-title {
    font-family: 'Playfair Display', serif;
    color: var(--cream);
    font-size: 18px;
    margin-bottom: 6px;
  }
  .smart-desc { color: rgba(249,245,239,0.6); font-size: 13px; margin-bottom: 16px; line-height: 1.5; }
  .smart-textarea {
    width: 100%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 10px;
    padding: 14px;
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    resize: vertical;
    min-height: 110px;
    outline: none;
    transition: border 0.2s;
  }
  .smart-textarea::placeholder { color: rgba(249,245,239,0.35); }
  .smart-textarea:focus { border-color: var(--gold); }
  .smart-btn {
    margin-top: 12px;
    background: var(--gold);
    color: var(--deep);
    border: none;
    padding: 11px 22px;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.2s, transform 0.1s;
  }
  .smart-btn:hover { background: var(--gold-light); }
  .smart-btn:active { transform: scale(0.98); }
  .smart-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .spinner { animation: spin 1s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* FORM FIELDS */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-grid.full { grid-template-columns: 1fr; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.span2 { grid-column: span 2; }
  label { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; }
  input, textarea, select {
    background: var(--cream);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--deep);
    outline: none;
    transition: border 0.2s;
    width: 100%;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--gold); }
  textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
  select { cursor: pointer; }

  /* BUTTONS */
  .btn-row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .btn-primary {
    background: var(--deep);
    color: var(--cream);
    border: none;
    padding: 11px 22px;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-primary:hover { background: var(--brown); }
  .btn-secondary {
    background: transparent;
    color: var(--muted);
    border: 1.5px solid var(--border);
    padding: 10px 20px;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-secondary:hover { border-color: var(--muted); color: var(--deep); }

  /* VISIT LIST */
  .visit-card {
    background: var(--warm-white);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    gap: 16px;
    align-items: flex-start;
    box-shadow: var(--shadow);
  }
  .visit-card:hover { border-color: var(--gold); box-shadow: var(--shadow-lg); transform: translateY(-1px); }
  .visit-avatar {
    width: 44px; height: 44px;
    background: #f58426;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: #ffffff;
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .visit-info { flex: 1; min-width: 0; }
  .visit-name {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--deep);
    margin-bottom: 3px;
  }
  .visit-address { font-size: 13px; color: var(--muted); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .visit-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 20px;
  }
  .tag-due { background: var(--red-light); color: var(--red); }
  .tag-soon { background: #fff8e6; color: #8a6000; }
  .tag-ok { background: var(--green-light); color: var(--green); }
  .tag-topic { background: var(--blue-light); color: var(--blue); }
  .visit-date { font-size: 12px; color: var(--muted); flex-shrink: 0; text-align: right; }

  /* DETAIL MODAL */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(26,18,8,0.6);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--warm-white);
    border-radius: 24px 24px 0 0;
    width: 100%;
    max-width: 720px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 28px 24px;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 20px; }
  .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .modal-name { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: var(--deep); }
  .modal-close {
    width: 32px; height: 32px;
    background: var(--border);
    border: none; border-radius: 50%;
    cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
  .detail-item { background: var(--cream); border-radius: 10px; padding: 12px 14px; }
  .detail-label { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 4px; }
  .detail-value { font-size: 14px; color: var(--deep); line-height: 1.4; }
  .detail-item.full { grid-column: span 2; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn-edit { flex: 1; background: var(--deep); color: var(--cream); border: none; padding: 12px; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-delete { background: var(--red-light); color: var(--red); border: 1.5px solid #f0c0c0; padding: 12px 18px; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }

  /* SEARCH + FILTER */
  .search-bar {
    display: flex; gap: 10px; margin-bottom: 16px;
  }
  .search-input {
    flex: 1;
    background: var(--warm-white);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--deep);
    outline: none;
  }
  .search-input:focus { border-color: var(--gold); }
  .filter-btn {
    background: var(--warm-white);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    cursor: pointer;
  }

  /* EMPTY STATE */
  .empty-state { text-align: center; padding: 60px 24px; }
  .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
  .empty-text { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--muted); margin-bottom: 8px; }
  .empty-sub { font-size: 14px; color: var(--muted); opacity: 0.7; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--deep); color: var(--cream);
    padding: 12px 22px; border-radius: 10px;
    font-size: 14px; font-weight: 500;
    box-shadow: var(--shadow-lg);
    z-index: 999;
    opacity: 0; transition: opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* DUE SOON BANNER */
  .due-banner {
    background: linear-gradient(135deg, #f58426, #d96e10);
    border-radius: 14px;
    padding: 16px 20px;
    margin-bottom: 20px;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .due-banner-icon { font-size: 24px; }
  .due-banner-text { flex: 1; }
  .due-banner-title { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
  .due-banner-sub { font-size: 13px; opacity: 0.75; }

  @media (max-width: 480px) {
    .form-grid { grid-template-columns: 1fr; }
    .field.span2 { grid-column: span 1; }
    .detail-grid { grid-template-columns: 1fr; }
    .detail-item.full { grid-column: span 1; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="app-icon">
      <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg" width="48" height="32">
        <!-- Knicks wordmark-style badge -->
        <rect width="120" height="80" rx="6" fill="#002f6c"/>
        <rect x="0" y="52" width="120" height="28" rx="0" fill="#f58426"/>
        <rect x="0" y="52" width="120" height="5" fill="#ffffff"/>
        <!-- NEW YORK text -->
        <text x="60" y="44" font-family="Arial Black, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">NEW YORK</text>
        <!-- KNICKS text -->
        <text x="60" y="72" font-family="Arial Black, sans-serif" font-size="15" font-weight="900" fill="#002f6c" text-anchor="middle" letter-spacing="1">KNICKS</text>
      </svg>
    </div>
    <div>
      <div class="app-title">Return Visits</div>
      <div class="app-subtitle">Ministry Record Keeper</div>
    </div>
  </div>
  <div class="header-count" id="headerCount">0 contacts</div>
</header>

<div class="nav-tabs">
  <div class="nav-tab active" onclick="switchTab('list')">📋 All Visits</div>
  <div class="nav-tab" onclick="switchTab('add')">＋ Add Visit</div>
  <div class="nav-tab" onclick="switchTab('due')">🔔 Due Soon</div>
</div>

<main>

  <!-- LIST TAB -->
  <div class="section active" id="tab-list">
    <div class="search-bar">
      <input class="search-input" type="text" placeholder="Search by name, address, topic…" oninput="renderList(this.value)">
    </div>
    <div id="visitList"></div>
  </div>

  <!-- ADD TAB -->
  <div class="section" id="tab-add">

    <!-- Smart Parse -->
    <div class="smart-box">
      <div class="smart-label">✦ AI Smart Fill</div>
      <div class="smart-title">Describe the visit naturally</div>
      <div class="smart-desc">Write a paragraph and the app will fill in every field automatically.</div>
      <textarea class="smart-textarea" id="smartInput" placeholder="e.g. I visited Maria Gonzalez today, June 7th, with Brother James. She lives at 421 Oak Street, Apt 3B. She's a Hispanic woman in her 50s. Her number is 323-555-0192. We talked about the resurrection and she seemed very interested. I should follow up in two weeks…"></textarea>
      <button class="smart-btn" id="smartBtn" onclick="smartParse()">
        <span id="smartBtnIcon">✦</span> <span id="smartBtnText">Auto-Fill Fields</span>
      </button>
    </div>

    <!-- Manual Form -->
    <div class="card">
      <div class="card-title"><span class="icon">👤</span> Contact Information</div>
      <div class="form-grid">
        <div class="field span2">
          <label>Full Name</label>
          <input type="text" id="f_name" placeholder="e.g. Maria Gonzalez">
        </div>
        <div class="field span2">
          <label>Address</label>
          <input type="text" id="f_address" placeholder="Street address, apt, city">
        </div>
        <div class="field">
          <label>Phone / Contact</label>
          <input type="tel" id="f_phone" placeholder="Phone number">
        </div>
        <div class="field">
          <label>Date of Initial Contact</label>
          <input type="date" id="f_date">
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="icon">🗒️</span> Description & Visit Details</div>
      <div class="form-grid">
        <div class="field">
          <label>Gender</label>
          <select id="f_gender">
            <option value="">Select…</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other / Unknown</option>
          </select>
        </div>
        <div class="field">
          <label>Approximate Age</label>
          <input type="text" id="f_age" placeholder="e.g. 50s, 30-40">
        </div>
        <div class="field span2">
          <label>Physical Description / Race / Appearance</label>
          <input type="text" id="f_description" placeholder="e.g. Hispanic woman, mid-50s, glasses">
        </div>
        <div class="field span2">
          <label>Ministry Partner (who was with you)</label>
          <input type="text" id="f_partner" placeholder="e.g. Brother James, Sister Tanya">
        </div>
        <div class="field span2">
          <label>Territory / Area</label>
          <input type="text" id="f_territory" placeholder="e.g. NW Block 4, Downtown Grid 2">
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="icon">💬</span> Visit Notes</div>
      <div class="form-grid">
        <div class="field span2">
          <label>Topics Discussed / Interests</label>
          <input type="text" id="f_topics" placeholder="e.g. Resurrection, Kingdom of God, prayer">
        </div>
        <div class="field span2">
          <label>Visit Notes</label>
          <textarea id="f_notes" placeholder="What happened during the visit? Receptiveness, questions asked, materials left…"></textarea>
        </div>
        <div class="field">
          <label>Follow-Up Date</label>
          <input type="date" id="f_followup">
        </div>
        <div class="field">
          <label>Status</label>
          <select id="f_status">
            <option value="active">Active</option>
            <option value="studying">Bible Study</option>
            <option value="not_home">Not Home / Try Again</option>
            <option value="not_interested">Not Interested</option>
          </select>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn-primary" onclick="saveVisit()">✔ Save Visit</button>
        <button class="btn-secondary" onclick="clearForm()">Clear</button>
      </div>
    </div>
  </div>

  <!-- DUE SOON TAB -->
  <div class="section" id="tab-due">
    <div id="dueList"></div>
  </div>

</main>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalContent">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-name" id="modal_name"></div>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="detail-grid" id="modal_grid"></div>
    <div class="modal-actions">
      <button class="btn-edit" onclick="editFromModal()">✏️ Edit Visit</button>
      <button class="btn-delete" onclick="deleteFromModal()">🗑 Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── DATA ──────────────────────────────────────────────────────────
let visits = JSON.parse(localStorage.getItem('rv_visits') || '[]');
let editingId = null;
let activeModalId = null;

function save() { localStorage.setItem('rv_visits', JSON.stringify(visits)); }

// ── TABS ──────────────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  event.currentTarget.classList.add('active');
  if (tab === 'list') renderList();
  if (tab === 'due') renderDue();
}

// ── RENDER LIST ───────────────────────────────────────────────────
function renderList(search = '') {
  const el = document.getElementById('visitList');
  const q = search.toLowerCase();
  let filtered = visits.filter(v =>
    !q || (v.name||'').toLowerCase().includes(q) ||
    (v.address||'').toLowerCase().includes(q) ||
    (v.topics||'').toLowerCase().includes(q) ||
    (v.territory||'').toLowerCase().includes(q)
  );
  filtered.sort((a,b) => new Date(b.date||0) - new Date(a.date||0));

  document.getElementById('headerCount').textContent = visits.length + ' contact' + (visits.length !== 1 ? 's' : '');

  if (!filtered.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">${search ? 'No results found' : 'No visits yet'}</div><div class="empty-sub">${search ? 'Try a different search' : 'Add your first return visit above'}</div></div>`;
    return;
  }

  el.innerHTML = filtered.map(v => {
    const initial = (v.name || '?')[0].toUpperCase();
    const dueTag = getDueTag(v.followup);
    const topicTags = v.topics ? v.topics.split(',').slice(0,2).map(t => `<span class="tag tag-topic">${t.trim()}</span>`).join('') : '';
    return `<div class="visit-card" onclick="openModal('${v.id}')">
      <div class="visit-avatar">${initial}</div>
      <div class="visit-info">
        <div class="visit-name">${v.name || 'Unknown'}</div>
        <div class="visit-address">${v.address || 'No address'}</div>
        <div class="visit-tags">${dueTag}${topicTags}</div>
      </div>
      <div class="visit-date">${formatDate(v.date)}</div>
    </div>`;
  }).join('');
}

function getDueTag(followup) {
  if (!followup) return '';
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(followup + 'T00:00:00');
  const diff = Math.round((due - today) / 86400000);
  if (diff < 0) return `<span class="tag tag-due">⚠ Overdue</span>`;
  if (diff <= 3) return `<span class="tag tag-due">🔴 Due in ${diff}d</span>`;
  if (diff <= 7) return `<span class="tag tag-soon">🟡 Due in ${diff}d</span>`;
  return `<span class="tag tag-ok">✓ ${formatDate(followup)}</span>`;
}

function formatDate(d) {
  if (!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

// ── RENDER DUE ────────────────────────────────────────────────────
function renderDue() {
  const el = document.getElementById('dueList');
  const today = new Date(); today.setHours(0,0,0,0);
  const due = visits.filter(v => {
    if (!v.followup) return false;
    const d = new Date(v.followup + 'T00:00:00');
    return Math.round((d - today) / 86400000) <= 7;
  }).sort((a,b) => new Date(a.followup) - new Date(b.followup));

  if (!due.length) {
    el.innerHTML = `<div class="due-banner"><div class="due-banner-icon">✅</div><div class="due-banner-text"><div class="due-banner-title">All caught up!</div><div class="due-banner-sub">No return visits due in the next 7 days.</div></div></div>`;
    return;
  }

  el.innerHTML = `<div class="due-banner"><div class="due-banner-icon">🔔</div><div class="due-banner-text"><div class="due-banner-title">${due.length} visit${due.length>1?'s':''} due soon</div><div class="due-banner-sub">Within the next 7 days</div></div></div>` +
    due.map(v => {
      const initial = (v.name||'?')[0].toUpperCase();
      return `<div class="visit-card" onclick="openModal('${v.id}')">
        <div class="visit-avatar">${initial}</div>
        <div class="visit-info">
          <div class="visit-name">${v.name||'Unknown'}</div>
          <div class="visit-address">${v.address||''}</div>
          <div class="visit-tags">${getDueTag(v.followup)}</div>
        </div>
      </div>`;
    }).join('');
}

// ── MODAL ─────────────────────────────────────────────────────────
function openModal(id) {
  const v = visits.find(x => x.id === id);
  if (!v) return;
  activeModalId = id;
  document.getElementById('modal_name').textContent = v.name || 'Unknown';

  const fields = [
    { label: '📍 Address', value: v.address },
    { label: '📞 Phone', value: v.phone },
    { label: '📅 Initial Contact', value: formatDate(v.date) },
    { label: '🔔 Follow-Up Date', value: formatDate(v.followup) },
    { label: '👤 Description', value: v.description, full: true },
    { label: '🤝 Ministry Partner', value: v.partner },
    { label: '🗺 Territory', value: v.territory },
    { label: '💬 Topics', value: v.topics, full: true },
    { label: '📝 Notes', value: v.notes, full: true },
    { label: '📊 Status', value: statusLabel(v.status) },
  ];

  document.getElementById('modal_grid').innerHTML = fields.filter(f => f.value).map(f =>
    `<div class="detail-item${f.full?' full':''}"><div class="detail-label">${f.label}</div><div class="detail-value">${f.value}</div></div>`
  ).join('');

  document.getElementById('modalOverlay').classList.add('open');
}

function statusLabel(s) {
  return { active: 'Active', studying: 'Bible Study', not_home: 'Not Home / Try Again', not_interested: 'Not Interested' }[s] || s || '—';
}

function closeModal(e) { if (e.target === document.getElementById('modalOverlay')) closeModalDirect(); }
function closeModalDirect() { document.getElementById('modalOverlay').classList.remove('open'); }

function editFromModal() {
  closeModalDirect();
  const v = visits.find(x => x.id === activeModalId);
  if (!v) return;
  editingId = v.id;
  document.getElementById('f_name').value = v.name || '';
  document.getElementById('f_address').value = v.address || '';
  document.getElementById('f_phone').value = v.phone || '';
  document.getElementById('f_date').value = v.date || '';
  document.getElementById('f_gender').value = v.gender || '';
  document.getElementById('f_age').value = v.age || '';
  document.getElementById('f_description').value = v.description || '';
  document.getElementById('f_partner').value = v.partner || '';
  document.getElementById('f_territory').value = v.territory || '';
  document.getElementById('f_topics').value = v.topics || '';
  document.getElementById('f_notes').value = v.notes || '';
  document.getElementById('f_followup').value = v.followup || '';
  document.getElementById('f_status').value = v.status || 'active';
  // switch to add tab
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-add').classList.add('active');
  document.querySelectorAll('.nav-tab')[1].classList.add('active');
  window.scrollTo(0, 0);
  showToast('✏️ Editing visit — save when done');
}

function deleteFromModal() {
  if (!confirm('Delete this visit permanently?')) return;
  visits = visits.filter(x => x.id !== activeModalId);
  save(); closeModalDirect(); renderList();
  showToast('🗑 Visit deleted');
}

// ── SAVE ──────────────────────────────────────────────────────────
function saveVisit() {
  const name = document.getElementById('f_name').value.trim();
  if (!name) { showToast('⚠ Please enter a name'); return; }

  const v = {
    id: editingId || Date.now().toString(),
    name,
    address: document.getElementById('f_address').value.trim(),
    phone: document.getElementById('f_phone').value.trim(),
    date: document.getElementById('f_date').value,
    gender: document.getElementById('f_gender').value,
    age: document.getElementById('f_age').value.trim(),
    description: document.getElementById('f_description').value.trim(),
    partner: document.getElementById('f_partner').value.trim(),
    territory: document.getElementById('f_territory').value.trim(),
    topics: document.getElementById('f_topics').value.trim(),
    notes: document.getElementById('f_notes').value.trim(),
    followup: document.getElementById('f_followup').value,
    status: document.getElementById('f_status').value,
  };

  if (editingId) {
    visits = visits.map(x => x.id === editingId ? v : x);
    editingId = null;
    showToast('✅ Visit updated');
  } else {
    visits.push(v);
    showToast('✅ Visit saved');
  }

  save(); clearForm();
  // switch to list
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-list').classList.add('active');
  document.querySelectorAll('.nav-tab')[0].classList.add('active');
  renderList();
}

function clearForm() {
  editingId = null;
  ['f_name','f_address','f_phone','f_date','f_age','f_description','f_partner','f_territory','f_topics','f_notes','f_followup'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f_gender').value = '';
  document.getElementById('f_status').value = 'active';
  document.getElementById('smartInput').value = '';
}

// ── SMART PARSE ───────────────────────────────────────────────────
async function smartParse() {
  const text = document.getElementById('smartInput').value.trim();
  if (!text) { showToast('⚠ Write a description first'); return; }

  const btn = document.getElementById('smartBtn');
  const icon = document.getElementById('smartBtnIcon');
  const label = document.getElementById('smartBtnText');
  btn.disabled = true;
  icon.classList.add('spinner'); icon.textContent = '↻';
  label.textContent = 'Analyzing…';

  const today = new Date().toISOString().split('T')[0];

  const prompt = `You are a ministry record parser. Extract information from the following paragraph and return ONLY valid JSON with these exact keys (use empty string "" if not found):
name, address, phone, date (YYYY-MM-DD, today is ${today}), gender (Male/Female/Other/Unknown), age (text like "50s"), description (physical/race/appearance), partner (who was with the minister), territory, topics (comma-separated), notes (visit details/receptiveness), followup (YYYY-MM-DD), status (active/studying/not_home/not_interested - default "active").

Paragraph: """${text}"""

Return ONLY the JSON object, no explanation.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({
        model: 'claude-haiku-4-5',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    const raw = data.content?.[0]?.text || '';
    const clean = raw.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);

    if (parsed.name) document.getElementById('f_name').value = parsed.name;
    if (parsed.address) document.getElementById('f_address').value = parsed.address;
    if (parsed.phone) document.getElementById('f_phone').value = parsed.phone;
    if (parsed.date) document.getElementById('f_date').value = parsed.date;
    if (parsed.gender) document.getElementById('f_gender').value = parsed.gender;
    if (parsed.age) document.getElementById('f_age').value = parsed.age;
    if (parsed.description) document.getElementById('f_description').value = parsed.description;
    if (parsed.partner) document.getElementById('f_partner').value = parsed.partner;
    if (parsed.territory) document.getElementById('f_territory').value = parsed.territory;
    if (parsed.topics) document.getElementById('f_topics').value = parsed.topics;
    if (parsed.notes) document.getElementById('f_notes').value = parsed.notes;
    if (parsed.followup) document.getElementById('f_followup').value = parsed.followup;
    if (parsed.status) document.getElementById('f_status').value = parsed.status;

    showToast('✦ Fields filled — review and save');
  } catch(e) {
    showToast('⚠ Could not parse — try again');
    console.error(e);
  } finally {
    btn.disabled = false;
    icon.classList.remove('spinner'); icon.textContent = '✦';
    label.textContent = 'Auto-Fill Fields';
  }
}

// ── TOAST ─────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ── INIT ──────────────────────────────────────────────────────────
renderList();

// ── SERVICE WORKER ────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
